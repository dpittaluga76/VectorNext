# Explicit model selection; 12B is the T28 default, with retained 26B alternatives.
services:
  processor:
    image: vectornext-app-processor:t28-12b
    environment:
      VECTORNEXT_GENERATOR_PROFILE: ${VECTORNEXT_GENERATOR_PROFILE:-12b}
  llm:
    image: vectornext-app-llm:t28-12b
    environment:
      VECTORNEXT_GENERATOR_PROFILE: ${VECTORNEXT_GENERATOR_PROFILE:-12b}
    command: []
