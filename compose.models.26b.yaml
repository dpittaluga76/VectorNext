# Optional 26B with 22 CPU-offloaded expert layers; apply after compose.models.yaml.
services:
  model-download:
    environment:
      VECTORNEXT_MODELS_LOCK: /workspace/experiments/t02/models.26b.lock.json

  model-check:
    environment:
      VECTORNEXT_MODELS_LOCK: /workspace/experiments/t02/models.26b.lock.json
      VECTORNEXT_GENERATOR_ALIAS: vectornext-gemma4-26b-a4b

  llm:
    command:
      - --model
      - /models/generator-26b/gemma-4-26B_q4_0-it.gguf
      - --alias
      - vectornext-gemma4-26b-a4b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - "99"
      # Keep the first 22 layers' expert weights in system RAM; attention stays on CUDA.
      - --n-cpu-moe
      - "22"
      - --parallel
      - "1"
      - --n-predict
      - "256"
      - --batch-size
      - "512"
      - --ubatch-size
      - "128"
      - --threads
      - "4"
      - --flash-attn
      - "on"
      - --jinja
      - --reasoning
      - "off"
      - --no-context-shift
      - --no-ui
      - --offline
      - --verbosity
      - "4"
    healthcheck:
      retries: 300
