services:
  gpu-check:
    image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    profiles: [tools]
    network_mode: none
    gpus: all
    entrypoint: nvidia-smi
    command: ["--query-gpu=name,memory.total,memory.used,driver_version", "--format=csv"]

  model-download:
    build:
      context: .
      dockerfile: docker/model-check.Dockerfile
    image: vectornext-model-check:t02
    profiles: [setup]
    volumes:
      - ./models:/models
    command: ["python", "-m", "experiments.t02.fetch_models"]

  llm:
    build:
      context: .
      dockerfile: docker/llama.Dockerfile
    image: vectornext-llama:b11617-cuda12
    gpus: all
    read_only: true
    tmpfs: [/tmp]
    init: true
    volumes:
      - ./models:/models:ro
    networks: [models-internal]
    command:
      - --model
      - /models/generator/gemma-4-E2B_q4_0-it.gguf
      - --alias
      - vectornext-gemma4-e2b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - "99"
      - --parallel
      - "1"
      - --n-predict
      - "256"
      - --batch-size
      - "512"
      - --ubatch-size
      - "128"
      - --threads
      - "4"
      - --flash-attn
      - "on"
      - --jinja
      - --reasoning
      - "off"
      - --no-context-shift
      - --no-ui
      - --offline
      - --verbosity
      - "4"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 5s

  model-check:
    build:
      context: .
      dockerfile: docker/model-check.Dockerfile
    image: vectornext-model-check:t02
    profiles: [tools]
    read_only: true
    tmpfs: [/tmp]
    cpus: 4
    mem_limit: 4g
    volumes:
      - ./models:/models:ro
      - ./data/t02:/results
    networks: [models-internal]
    depends_on:
      llm:
        condition: service_healthy

networks:
  models-internal:
    internal: true
