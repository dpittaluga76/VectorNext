services:
  ingest:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    image: vectornext-ingestion:t08
    profiles: [tools]
    read_only: true
    init: true
    tmpfs: [/tmp]
    cpus: 4
    mem_limit: 4g
    pids_limit: 128
    cap_drop: [ALL]
    volumes:
      - ./models:/models:ro
      - ingestion-data:/storage
      - ingestion-cache:/cache
    networks: [models-internal]

  llm:
    extends:
      file: compose.models.yaml
      service: llm
    profiles: [generation]
    entrypoint: [python, /launch_llm.py]
    volumes:
      - ./model_worker/launch_llm.py:/launch_llm.py:ro
      - ./model_worker/scheduler.py:/scheduler.py:ro
      - ./experiments/t02/models.26b.lock.json:/models.lock.json:ro
    command: [--model, /models/generator-26b/gemma-4-26B_q4_0-it.gguf, --alias, vectornext-gemma4-26b-a4b,
      --host, 0.0.0.0, --port, '8080', --ctx-size, '4096', --n-gpu-layers, '99', --n-cpu-moe, '22',
      --parallel, '1', --n-predict, '256', --batch-size, '512', --ubatch-size, '128', --threads, '4',
      --flash-attn, 'on', --jinja, --reasoning, 'off', --no-context-shift, --no-ui, --offline, --verbosity, '4']
    healthcheck:
      retries: 300

networks:
  models-internal:
    internal: true
volumes:
  ingestion-data:
  ingestion-cache:
