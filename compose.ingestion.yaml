services:
  ingest:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    image: vectornext-ingestion:t27
    profiles: [tools]
    read_only: true
    init: true
    tmpfs: [/tmp]
    cpus: 4
    mem_limit: 4g
    pids_limit: 128
    cap_drop: [ALL]
    volumes:
      - ./models:/models:ro
      - ingestion-data:/storage
      - ingestion-cache:/cache
    networks: [models-internal]
    environment:
      VECTORNEXT_GENERATOR_PROFILE: ${VECTORNEXT_GENERATOR_PROFILE:-26b-offload22}

  llm:
    extends:
      file: compose.models.yaml
      service: llm
    profiles: [generation]
    entrypoint: [python, -m, model_worker.launch_llm]
    working_dir: /app
    environment:
      VECTORNEXT_GENERATOR_PROFILE: ${VECTORNEXT_GENERATOR_PROFILE:-26b-offload22}
    volumes:
      - ./model_worker:/app/model_worker:ro
      - ./experiments/t02:/app/experiments/t02:ro
      - ./experiments/t27:/app/experiments/t27:ro
    command: []
    healthcheck:
      retries: 300

networks:
  models-internal:
    internal: true
volumes:
  ingestion-data:
  ingestion-cache:
