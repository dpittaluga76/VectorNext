services:
  ingest:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    image: vectornext-ingestion:t37-hybrid
    profiles: [tools]
    read_only: true
    init: true
    tmpfs: [/tmp]
    cpus: 4
    mem_limit: 4g
    pids_limit: 128
    cap_drop: [ALL]
    volumes:
      - ./models:/models:ro
      - ingestion-data:/storage
      - ingestion-cache:/cache
    networks: [models-internal]

  llm:
    build:
      context: .
      dockerfile: docker/app-llm.Dockerfile
    image: vectornext-app-llm:t37-hybrid
    profiles: [generation]
    gpus: all
    init: true
    read_only: true
    tmpfs: [/tmp]
    volumes: [./models:/models:ro]
    networks: [models-internal]

networks:
  models-internal:
    internal: true
volumes:
  ingestion-data:
  ingestion-cache:
