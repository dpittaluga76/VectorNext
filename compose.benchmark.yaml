# T20 only. No application volumes, model access or published ports.
name: vectornext-t20
services:
  vectornext:
    image: vectornext-benchmark:t20
    build: {context: ., dockerfile: docker/benchmark.Dockerfile}
    cpus: 2
    mem_limit: 4g
    read_only: true
    tmpfs: [/tmp:size=67108864]
    volumes: [vector_data:/storage]
    networks: [benchmark]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 10
  postgres:
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    cpus: 2
    mem_limit: 4g
    shm_size: 512m
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: t20-isolated-fixture-only
      POSTGRES_DB: benchmark
    command: [postgres, -c, shared_buffers=512MB, -c, work_mem=32MB, -c, maintenance_work_mem=512MB, -c, max_parallel_workers_per_gather=0, -c, max_parallel_maintenance_workers=0]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [benchmark]
    healthcheck:
      test: [CMD, pg_isready, -U, benchmark, -d, benchmark]
      interval: 5s
      timeout: 2s
      retries: 10
  runner:
    image: vectornext-benchmark-runner:t20
    build: {context: ., dockerfile: docker/benchmark-runner.Dockerfile}
    profiles: [tools]
    cpus: 2
    mem_limit: 2g
    environment:
      VECTORNEXT_BENCH_URL: http://vectornext:8080
      PGHOST: postgres
      PGUSER: benchmark
      PGPASSWORD: t20-isolated-fixture-only
      PGDATABASE: benchmark
    volumes:
      - ./data/t20:/results
      - .:/source:ro
    networks: [benchmark]
networks:
  benchmark:
    internal: true
    ipam:
      config: [{subnet: "${T20_SUBNET:-10.219.20.0/28}"}]
volumes:
  vector_data:
  postgres_data:
