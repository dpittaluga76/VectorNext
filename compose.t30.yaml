# Isolated T30 project only; apply after compose.app.yaml and compose.app.models.yaml.
services:
  vectornext:
    image: vectornext-app:t30
    environment:
      VECTORNEXT_DATA: ${T30_DATABASE:-/storage/preflight}
      VECTORNEXT_STRUCTURAL_WEIGHT: 1
      VECTORNEXT_GENERATED_WEIGHT: 1
    ports: !override ["127.0.0.1:8100:8088"]
  processor:
    image: vectornext-app-processor:t30
    environment:
      VECTORNEXT_ANSWER_MODE: two_call
      VECTORNEXT_CACHE: ${T30_CACHE:-/cache/preflight}
  llm:
    image: vectornext-app-llm:t30
    restart: "no"
    volumes: !override [generation-models:/models:ro]
networks:
  local:
    ipam:
      config: [{subnet: "10.254.33.0/24"}]
  ingress:
    ipam:
      config: [{subnet: "10.254.34.0/24"}]
volumes:
  generation-models:
    external: true
    name: vectornext-t27-generation-models
