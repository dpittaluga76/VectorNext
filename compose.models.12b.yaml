# Explicit 12B selection; also the T28 base default.
services:
  model-download:
    image: vectornext-model-check:t28-12b
    environment:
      VECTORNEXT_MODELS_LOCK: /workspace/experiments/t27/models.12b.lock.json
  model-check:
    image: vectornext-model-check:t28-12b
    environment:
      VECTORNEXT_MODELS_LOCK: /workspace/experiments/t27/models.12b.lock.json
      VECTORNEXT_GENERATOR_ALIAS: vectornext-gemma4-12b
  llm:
    command: [--model, /models/generator-12b/gemma-4-12b-it-qat-q4_0.gguf, --alias, vectornext-gemma4-12b,
      --host, 0.0.0.0, --port, '8080', --ctx-size, '4096', --n-gpu-layers, '99',
      --parallel, '1', --n-predict, '256', --batch-size, '512', --ubatch-size, '128', --threads, '4',
      --flash-attn, 'on', --jinja, --reasoning, 'off', --no-context-shift, --no-ui, --offline, --verbosity, '4']
