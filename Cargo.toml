[package]
name = "vectornext"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license-file = "LICENSE"
description = "VectorNext's local document and vector storage core"

[features]
# Offline evaluation helpers only; never enabled by the production Docker build.
measurement = []

[[example]]
name = "measurement_evidence"
path = "examples/measurement_evidence.rs"
required-features = ["measurement"]

[[example]]
name = "measurement_candidate"
path = "examples/measurement_candidate.rs"
required-features = ["measurement"]

[[example]]
name = "measurement_table_preflight"
path = "examples/measurement_table_preflight.rs"
required-features = ["measurement"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "=0.22.1"
crc32fast = "=1.5.0"
fs2 = "=0.4.3"
libc = "=0.2.190"
multipart = { version = "=0.18.0", default-features = false, features = ["server"] }
num-bigint = "=0.4.6"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "float_roundtrip"] }
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
utoipa = { version = "=5.4.0", features = ["axum_extras"] }
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = { version = "=9.0.2", default-features = false, features = ["vendored"] }
ureq = { version = "=2.12.1", default-features = false }
unicode-normalization = "=0.1.24"

[dev-dependencies]
tiny_http = "=0.12.0"
tower = { version = "=0.5.2", features = ["util"] }
tempfile = "=3.20.0"
