name: vectornext
services:
  vectornext:
    image: vectornext-app:t21
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    tmpfs: [/tmp:size=67108864]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      VECTORNEXT_DATA: ${VECTORNEXT_DATA:-/storage/db}
      VECTORNEXT_PROCESSOR_URL: http://processor:8090
      VECTORNEXT_STRUCTURAL_WEIGHT: ${VECTORNEXT_STRUCTURAL_WEIGHT:-1}
      VECTORNEXT_GENERATED_WEIGHT: ${VECTORNEXT_GENERATED_WEIGHT:-1}
    volumes: [data:/storage]
    networks: [local, ingress]
    ports: ["127.0.0.1:${VECTORNEXT_PORT:-8088}:8088"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  processor:
    image: vectornext-app-processor:t18
    build:
      context: .
      dockerfile: docker/app-processor.Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    cpus: 4
    mem_limit: 6g
    pids_limit: 192
    tmpfs: [/tmp:size=1073741824]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${VECTORNEXT_MODELS_DIR:-./models}:/models:ro
      - cache:/cache
    networks: [local]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  llm:
    image: vectornext-app-llm:t18
    build:
      context: .
      dockerfile: docker/app-llm.Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    gpus: all
    cpus: 8
    mem_limit: 32g
    pids_limit: 192
    tmpfs: [/tmp:size=536870912]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${VECTORNEXT_MODELS_DIR:-./models}:/models:ro
    networks: [local]
    command: [--model, /models/generator-26b/gemma-4-26B_q4_0-it.gguf, --alias, vectornext-gemma4-26b-a4b,
      --host, 0.0.0.0, --port, '8080', --ctx-size, '4096', --n-gpu-layers, '99', --n-cpu-moe, '22',
      --parallel, '1', --n-predict, '256', --batch-size, '512', --ubatch-size, '128', --threads, '4',
      --flash-attn, 'on', --jinja, --reasoning, 'off', --no-context-shift, --no-ui, --offline, --verbosity, '4']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 12

  client:
    image: vectornext-app:t21
    profiles: [tools]
    entrypoint: [python, -m, deployment.client]
    read_only: true
    tmpfs: [/tmp:size=8388608]
    cpus: 1
    mem_limit: 256m
    cap_drop: [ALL]
    environment:
      VECTORNEXT_URL: http://vectornext:8088
    networks: [local]

  admin:
    image: vectornext-app:t21
    profiles: [tools]
    command: [inspect, /storage/db]
    read_only: true
    tmpfs: [/tmp:size=67108864]
    cpus: 2
    mem_limit: 4g
    cap_drop: [ALL]
    network_mode: none
    volumes:
      - data:/storage
      - ${VECTORNEXT_BACKUPS_DIR:-./backups}:/backups

networks:
  ingress:
  local:
    internal: true
volumes:
  data:
  cache:
