# Isolated T28 project only; apply after compose.app.yaml and compose.app.models.yaml.
services:
  vectornext:
    image: vectornext-app:t28
    environment:
      VECTORNEXT_DATA: ${T28_DATABASE:-/storage/preflight}
      VECTORNEXT_STRUCTURAL_WEIGHT: 1
      VECTORNEXT_GENERATED_WEIGHT: 1
    ports: !override ["127.0.0.1:8098:8088"]
  processor:
    image: vectornext-app-processor:t28
    environment:
      VECTORNEXT_CACHE: ${T28_CACHE:-/cache/preflight}
  llm:
    image: vectornext-app-llm:t28
    restart: "no"
    volumes: !override [generation-models:/models:ro]
networks:
  local:
    ipam:
      config: [{subnet: "10.254.29.0/24"}]
  ingress:
    ipam:
      config: [{subnet: "10.254.30.0/24"}]
volumes:
  generation-models:
    external: true
    name: vectornext-t27-generation-models
