# Explicit isolated operational/evaluation project; never reuse the normal volume.
name: vectornext-t37
services:
  vectornext:
    extends: {file: compose.app.yaml, service: vectornext}
    ports: !override ["127.0.0.1:8097:8088"]
    environment:
      VECTORNEXT_DATA: /storage/db
      VECTORNEXT_DEFAULT_ANSWER_MODE: hybrid
  processor:
    extends: {file: compose.app.yaml, service: processor}
  llm:
    extends: {file: compose.app.yaml, service: llm}
networks:
  ingress:
  local:
    internal: true
volumes:
  data:
  cache:
