# Apply after compose.app.yaml with -p vectornext-t11. T11 API fixes UTF-8 line mapping.
services:
  vectornext:
    image: vectornext-app:t11
    environment:
      VECTORNEXT_DATA: ${T11_DATABASE:-/storage/independent}
      VECTORNEXT_GENERATED_WEIGHT: 1
      VECTORNEXT_STRUCTURAL_WEIGHT: 1
    ports: !override ["127.0.0.1:8091:8088"]
  processor:
    image: vectornext-app-processor:t10
    environment:
      VECTORNEXT_CACHE: ${T11_CACHE:-/cache/independent-ingest}
  llm:
    image: vectornext-app-llm:t10
  client:
    image: vectornext-app:t11
  admin:
    image: vectornext-app:t11
